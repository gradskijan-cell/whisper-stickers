name: Стикеры для Шёпота
on:
  workflow_dispatch:
    inputs:
      packs:
        description: 'Ссылки на паки t.me/addstickers/… (можно несколько через пробел)'
        required: false
        default: ''
      rebuild:
        description: 'Скачать все паки заново'
        type: boolean
        default: false
  push:
    paths: ['packs.txt', 'gifs/**', 'build_stickers.py']
permissions:
  contents: write
concurrency:
  group: stickers
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q Pillow rlottie-python
      - name: Скачать и подготовить стикеры
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PACKS_INPUT: ${{ inputs.packs }}
          REBUILD: ${{ inputs.rebuild }}
        run: python build_stickers.py
      - name: Сохранить в репозиторий
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Стикеры обновлены"
          git push
